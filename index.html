<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08101f"><title>Mase Mail</title><style>
:root{font-family:Inter,system-ui,Arial;color:#eff6ff;background:#08101f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#2b2154,#08101f 50%)}header{padding:24px max(20px,calc((100vw - 1150px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #273550}h1{font-size:25px;margin:0}header span,.muted{color:#a4b8d2}main{max-width:1150px;margin:30px auto;padding:0 20px}h2{margin:0 0 16px}.panel{background:#101c30;border:1px solid #293854;border-radius:18px;padding:24px;box-shadow:0 10px 28px #0003}input{display:block;width:100%;background:#081527;color:white;border:1px solid #354664;border-radius:9px;padding:14px;margin:12px 0}button{background:linear-gradient(100deg,#65dbef,#ae8cff);border:0;color:#091126;padding:12px 17px;border-radius:10px;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.ghost{background:#20304c;color:#e3edff}.error{color:#ff9fb0;min-height:24px}.hidden{display:none!important}.auth{max-width:430px;margin:65px auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}.layout{display:grid;grid-template-columns:330px 1fr;gap:20px}.list{display:grid;gap:9px;max-height:550px;overflow:auto}.address{background:#1a2a42;color:#e9f7ff;border:1px solid #334462;text-align:left;padding:12px;overflow-wrap:anywhere}.address.active{border-color:#6ee7ff;background:#183647}.mail{padding:16px;border-bottom:1px solid #263b57;cursor:pointer}.mail:hover{background:#1a2a40}.sub{font-size:13px;color:#95accb;padding-top:4px}.message-body{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #30415d;padding-top:14px;margin-top:12px}.toprow{display:flex;gap:8px;flex-wrap:wrap}.note{color:#86b8bd;font-size:13px}.identity{font-size:17px;overflow-wrap:anywhere;font-weight:750}@media(max-width:750px){.layout{grid-template-columns:1fr}.auth{margin:30px auto}} </style></head><body>
<header><div><h1>✉ Mase Mail</h1><span>Receive-only email. Your inbox, forever.</span></div><div id="account" class="hidden"><span id="loginName"></span> <button id="logout" class="ghost">Log out</button></div></header>
<main><section id="auth" class="panel auth"><h2 id="authTitle">Log in</h2><p class="muted">Private mailboxes with randomly generated real-looking names.</p><form id="authForm"><input id="username" type="text" placeholder="Username" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+"><input id="password" type="password" placeholder="Password (12+ characters for registration)" autocomplete="current-password" required><button id="authSubmit">Log in</button></form><p id="authError" class="error" role="alert"></p><button class="ghost" id="modeSwitch">Need an account? Sign up</button></section>
<section id="dashboard" class="hidden"><div class="bar"><div><h2>Your mailboxes</h2><div class="note">Permanent inboxes · receiving only · no sending</div></div><button id="newAddress">+ Generate random name email</button></div><p id="appError" class="error" role="alert"></p><div class="layout"><aside class="panel"><h2>Addresses</h2><div id="addresses" class="list"></div></aside><section class="panel"><div class="bar"><div><div class="identity" id="selectedAddress">Select an inbox</div><p class="muted" id="count"></p></div><div class="toprow"><button id="copy" class="ghost">Copy email</button><button id="refresh" class="ghost">Refresh</button></div></div><div id="messages" class="list"><p class="muted">Choose an inbox to read messages.</p></div><article id="detail" class="hidden"></article></section></div></section></main>
<script>
(()=>{'use strict';const API='https://mase-mail.hellerud-mason.workers.dev';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('mase_token')||'',user=null,boxes=[],selected=null,register=false,items=[];const error=(id,s)=>$(id).textContent=s||'';
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){const res=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await res.json();if(!res.ok)throw Error(data.error||`HTTP ${res.status}`);return data;}
function show(logged){$('auth').classList.toggle('hidden',logged);$('dashboard').classList.toggle('hidden',!logged);$('account').classList.toggle('hidden',!logged);$('loginName').textContent=user?.login||'';}
$('modeSwitch').onclick=()=>{register=!register;$('authTitle').textContent=register?'Create an account':'Log in';$('authSubmit').textContent=register?'Sign up':'Log in';$('modeSwitch').textContent=register?'Already registered? Log in':'Need an account? Sign up';$('password').autocomplete=register?'new-password':'current-password';error('authError','')};
$('authForm').onsubmit=async e=>{e.preventDefault();error('authError','');$('authSubmit').disabled=true;try{let data=await api(register?'/auth/register':'/auth/login','POST',{login:$('username').value,password:$('password').value});token=data.token;sessionStorage.setItem('mase_token',token);user=data.user;$('password').value='';show(true);await loadBoxes()}catch(e){error('authError',e.message)}finally{$('authSubmit').disabled=false}};
$('logout').onclick=async()=>{try{await api('/auth/logout','POST')}catch{}token='';sessionStorage.removeItem('mase_token');boxes=[];selected=null;user=null;show(false)};
async function loadBoxes(){try{const d=await api('/mailboxes');boxes=d.mailboxes||[];if(!boxes.some(b=>b.id===selected))selected=boxes[0]?.id||null;renderBoxes();await loadMessages()}catch(e){error('appError',e.message)}}
function renderBoxes(){$('addresses').innerHTML=boxes.length?boxes.map(b=>`<button class="address ${b.id===selected?'active':''}" data-id="${escape(b.id)}">${escape(b.address)}</button>`).join(''):'<p class="muted">No addresses yet. Generate one!</p>';$('addresses').querySelectorAll('button').forEach(btn=>btn.onclick=async()=>{selected=btn.dataset.id;renderBoxes();await loadMessages()});$('selectedAddress').textContent=boxes.find(b=>b.id===selected)?.address||'Select an inbox'}
$('newAddress').onclick=async()=>{error('appError','');$('newAddress').disabled=true;try{let box=await api('/mailboxes','POST');boxes.unshift(box);selected=box.id;renderBoxes();await loadMessages()}catch(e){error('appError',e.message)}finally{$('newAddress').disabled=false}};
async function loadMessages(){if(!selected){$('messages').innerHTML='<p class="muted">No mailbox selected.</p>';$('count').textContent='';return}try{const d=await api('/messages?id='+encodeURIComponent(selected));items=d.messages||[];$('count').textContent=`${items.length} recent message(s)`;$('detail').classList.add('hidden');$('messages').classList.remove('hidden');$('messages').innerHTML=items.length?items.map((m,i)=>`<div class="mail" data-index="${i}"><strong>${escape(m.subject||'(No subject)')}</strong><div class="sub">From: ${escape(m.sender)}</div><div class="sub">${new Date(m.received_at).toLocaleString()}</div></div>`).join(''):'<p class="muted">No messages yet. Emails arriving at this address will appear here.</p>';$('messages').querySelectorAll('.mail').forEach(el=>el.onclick=()=>openMail(Number(el.dataset.index)));error('appError','')}catch(e){error('appError',e.message)}}
function openMail(i){const m=items[i];if(!m)return;$('messages').classList.add('hidden');$('detail').classList.remove('hidden');$('detail').innerHTML=`<button class="ghost" id="back">← Back to inbox</button><h2>${escape(m.subject||'(No subject)')}</h2><p class="muted">From ${escape(m.sender)} · ${new Date(m.received_at).toLocaleString()}</p><div class="message-body">${escape(m.text_body||'[HTML-only message. Raw HTML is not displayed for security.]')}</div>`;$('back').onclick=()=>{$('detail').classList.add('hidden');$('messages').classList.remove('hidden')}}
$('refresh').onclick=loadMessages;$('copy').onclick=async()=>{const b=boxes.find(b=>b.id===selected);if(b){try{await navigator.clipboard.writeText(b.address);$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy email',1100)}catch{prompt('Copy:',b.address)}}};
(async()=>{if(!token)return;try{const d=await api('/auth/me');user=d.user;show(true);await loadBoxes()}catch{token='';sessionStorage.removeItem('mase_token');show(false)}})();setInterval(()=>{if(token&&selected&&!document.hidden)loadMessages()},30000);
})();
</script></body></html>
